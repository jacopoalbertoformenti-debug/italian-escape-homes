<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina non trovata · Italian Escapes Homes</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --terracotta:#C4704F; --brown:#8B5E3C; --dark:#1E1810;
      --bg:#FFF8F3; --sand:#F5E6D3; --text:#3D2B1F; --text-light:#7A5C4A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif; font-weight: 300;
      text-align: center; padding: 32px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 520px; }
    .eyebrow {
      font-size: .72rem; letter-spacing: .24em; text-transform: uppercase;
      color: var(--terracotta); font-weight: 500; margin-bottom: 18px;
    }
    .code {
      font-family: 'Cormorant Garamond', serif; font-weight: 400;
      font-size: 6rem; line-height: 1; color: var(--dark); margin-bottom: 8px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif; font-weight: 400;
      font-size: 2rem; color: var(--dark); margin-bottom: 14px;
    }
    p { color: var(--text-light); font-size: 1rem; margin-bottom: 32px; line-height: 1.6; }
    .btn {
      display: inline-block; background: var(--terracotta); color: #fff;
      text-decoration: none; padding: 14px 30px; border-radius: 999px;
      font-size: .82rem; letter-spacing: .12em; text-transform: uppercase;
      font-weight: 500; transition: background .25s, transform .2s;
    }
    .btn:hover { background: var(--brown); transform: translateY(-2px); }
    .links { margin-top: 26px; font-size: .85rem; }
    .links a { color: var(--terracotta); text-decoration: none; margin: 0 10px; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">Italian Escapes Homes</div>
    <div class="code">404</div>
    <h1>Pagina non trovata</h1>
    <p>La pagina che cercavi non esiste o è stata spostata. Torna alla home per scoprire le nostre case tra mare, lago e montagna.</p>
    <a class="btn" href="/">Torna alla home</a>
    <div class="links">
      <a href="/casa-mariangela/">Casa Mariangela</a>
      <a href="/lake-at-home/">Lake At Home</a>
      <a href="/dolce-vetta-valmalenco/">Dolce Vetta</a>
    </div>
  </main>
</body>
</html>
